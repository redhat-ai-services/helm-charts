{{- if .Values.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "llm-d-kserve.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-kserve.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{- include "llm-d-kserve.fullname" . }}-kserve
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.serverAddress }}
        authModes: bearer
        unsafeSsl: "true"
        namespace: {{ .Release.Namespace }}
        metricName: {{ .Values.autoscaling.scaleMetric }}
        query: |
          sum({{ .Values.autoscaling.scaleMetric }}{namespace="{{ .Release.Namespace }}"})
        threshold: "{{ .Values.autoscaling.threshold }}"
        activationThreshold: "{{ .Values.autoscaling.activationThreshold }}"
      authenticationRef:
        name: {{ include "llm-d-kserve.fullname" . }}
{{- end }}
